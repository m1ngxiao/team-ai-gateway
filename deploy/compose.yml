name: team-ai-gateway

services:
  gateway:
    image: team-ai-gateway:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP_VERSION: "0.1.0"
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-4}
        PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://127.0.0.1:48760}
        PUBLIC_ADMIN_ORIGIN: ${PUBLIC_ADMIN_ORIGIN:-http://127.0.0.1:48761}
        PUBLIC_STATS_ORIGIN: ${PUBLIC_STATS_ORIGIN:-http://127.0.0.1:48763}
        HTTP_PROXY: ${HTTP_PROXY-}
        HTTPS_PROXY: ${HTTPS_PROXY-}
        NO_PROXY: localhost,127.0.0.1,::1
    user: "10001:10001"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    cpus: ${GATEWAY_CPUS:-4.0}
    mem_limit: ${GATEWAY_MEMORY:-8g}
    environment:
      TZ: ${TZ:-UTC}
      CODEXMANAGER_DYNAMIC_OVERLOAD_ENABLED: ${DYNAMIC_OVERLOAD_ENABLED:-true}
      CODEXMANAGER_CODEX_LATEST_SYNC_INTERVAL_SECS: ${CODEX_LATEST_SYNC_INTERVAL_SECS:-86400}
      CODEXMANAGER_HTTP_WORKER_MIN: ${HTTP_WORKERS:-8}
      CODEXMANAGER_HTTP_WORKER_MAX: ${HTTP_WORKERS:-8}
      CODEXMANAGER_HTTP_STREAM_WORKER_MIN: ${STREAM_WORKERS:-8}
      CODEXMANAGER_HTTP_STREAM_WORKER_MAX: ${STREAM_WORKERS:-8}
      TOKIO_WORKER_THREADS: ${TOKIO_WORKER_THREADS:-4}
      RAYON_NUM_THREADS: ${RAYON_NUM_THREADS:-4}
      CODEXMANAGER_SERVICE_ADDR: 0.0.0.0:48760
      CODEXMANAGER_WEB_ADDR: 0.0.0.0:48761
      CODEXMANAGER_WEB_NO_OPEN: "1"
      CODEXMANAGER_DB_PATH: /data/codexmanager.db
      CODEXMANAGER_RPC_TOKEN_FILE: /data/codexmanager.rpc-token
      CODEXMANAGER_UPSTREAM_PROXY_URL: ${UPSTREAM_PROXY-}
      HTTP_PROXY: ${UPSTREAM_PROXY-}
      HTTPS_PROXY: ${UPSTREAM_PROXY-}
      ALL_PROXY: ${UPSTREAM_PROXY-}
      http_proxy: ${UPSTREAM_PROXY-}
      https_proxy: ${UPSTREAM_PROXY-}
      all_proxy: ${UPSTREAM_PROXY-}
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
      CODEXMANAGER_GATEWAY_TRACE_STDOUT: "1"
      CODEXMANAGER_GATEWAY_ERROR_STDOUT: "1"
      CODEXMANAGER_GATEWAY_TRACE_STDOUT_SLOW_MS: "5000"
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-48760}:48760"
      - "127.0.0.1:${ADMIN_PORT:-48761}:48761"
    volumes:
      - type: bind
        source: ./data/gateway
        target: /data
        bind: {create_host_path: false}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    stop_grace_period: 45s

  collector:
    profiles: [dashboard]
    image: team-ai-gateway-dashboard:0.1.0
    user: "10001:10001"
    restart: unless-stopped
    command: [python, -m, dashboard.collector, --config, /run/dashboard/collector.json, --source-db, /source/codexmanager.db, --output, /data/snapshot.json]
    network_mode: none
    volumes:
      - type: bind
        source: ./data/gateway
        target: /source
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./private/collector.json
        target: /run/dashboard/collector.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./data/dashboard
        target: /data
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${COLLECTOR_MEMORY:-256m}
    cpus: ${COLLECTOR_CPUS:-0.5}
    pids_limit: 32
    healthcheck:
      test: [CMD, python, -c, "import os,time; p='/data/snapshot.json'; assert os.path.isfile(p) and time.time()-os.path.getmtime(p)<180"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

  dashboard:
    profiles: [dashboard]
    image: team-ai-gateway-dashboard:0.1.0
    build:
      context: ../services/dashboard
      args:
        HTTP_PROXY: ${HTTP_PROXY-}
        HTTPS_PROXY: ${HTTPS_PROXY-}
        NO_PROXY: localhost,127.0.0.1,::1
    user: "10001:10001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STATS_PORT:-48763}:48763"
    environment:
      DASHBOARD_AUTH_FILE: /run/dashboard/auth.json
      DASHBOARD_SNAPSHOT: /data/snapshot.json
    volumes:
      - type: bind
        source: ./data/dashboard
        target: /data
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./private/auth.json
        target: /run/dashboard/auth.json
        read_only: true
        bind: {create_host_path: false}
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${DASHBOARD_MEMORY:-256m}
    cpus: ${DASHBOARD_CPUS:-1.0}
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:48763/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "3"}

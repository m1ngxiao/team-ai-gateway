# Optional split-UI topology. The administration frontend runs beside the API
# gateway so UI-only releases can switch behind the tunnel without restarting
# the gateway service.
services:
  web-ui:
    image: ${TEAM_GATEWAY_IMAGE:-team-ai-gateway:latest}
    entrypoint: ["/usr/local/bin/codexmanager-web"]
    user: "10001:10001"
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid,nodev"]
    environment:
      TZ: UTC
      CODEXMANAGER_SERVICE_ADDR: ${TEAM_GATEWAY_SERVICE_ADDR:-codexmanager:48760}
      CODEXMANAGER_WEB_ADDR: 0.0.0.0:48761
      CODEXMANAGER_WEB_NO_OPEN: "1"
      # Never let a UI preview stop or replace the production service.
      CODEXMANAGER_WEB_NO_SPAWN_SERVICE: "1"
      CODEXMANAGER_DB_PATH: /data/codexmanager.db
      CODEXMANAGER_RPC_TOKEN_FILE: /run/gateway/rpc-token
      NO_PROXY: localhost,127.0.0.1,::1,codexmanager
      no_proxy: localhost,127.0.0.1,::1,codexmanager
    ports:
      - "${ADMIN_WEB_BIND_ADDR:-127.0.0.1}:${ADMIN_WEB_PORT:-48766}:48761"
    volumes:
      - type: bind
        source: ${TEAM_GATEWAY_DATA_DIR:-./data/codexmanager}
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ${TEAM_GATEWAY_DATA_DIR:-./data/codexmanager}/codexmanager.rpc-token
        target: /run/gateway/rpc-token
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "wget --no-verbose --tries=1 --spider http://127.0.0.1:48761/__auth_status || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
